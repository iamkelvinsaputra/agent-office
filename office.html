<!doctype html>
<html lang="en" data-default-theme="__DEFAULT_THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #d9dee7;
    --needs: #e08a00; --working: #2f7de1; --turn: #2a9d68; --tag: rgba(255,255,255,0.94);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b1f29; --text: #e7eaf0; --muted: #8b93a7; --line: #2a3040;
      --needs: #ffb020; --working: #5aa2ff; --turn: #4cc98f; --tag: rgba(20,23,31,0.88);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .counts b { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: #999; }
  .needs_you .dot, .dot.needs_you { background: var(--needs); }
  .working .dot, .dot.working { background: var(--working); }
  .your_turn .dot, .dot.your_turn { background: var(--turn); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  #offline { color: var(--needs); font-size: 13px; display: none; }
  .themes { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--line); }
  .themes button {
    font: 600 12.5px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--muted); background: transparent;
    border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer;
  }
  .themes button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .themes[hidden] { display: none; }
  .themes button:focus-visible { outline: 2px solid var(--working); outline-offset: 1px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl {
    position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    will-change: transform;
  }
  .bubble {
    --c: #999; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff;
    font: 700 13px/22px -apple-system, sans-serif; text-align: center; position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -4px;
    border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--c);
  }
  .bubble.needs_you { --c: var(--needs); animation: hop 0.55s ease-in-out infinite alternate; }
  .bubble.working { --c: var(--working); }
  .bubble.your_turn { --c: var(--turn); }
  @keyframes hop { to { transform: translateY(-6px); } }
  .tag {
    background: var(--tag); color: var(--text); font: 600 12px -apple-system, sans-serif; white-space: nowrap;
    padding: 4px 10px 4px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,0.16);
  }
  .tag .dot { width: 7px; height: 7px; margin-right: 5px; vertical-align: 0; }
  #quiet, #nogl {
    position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: var(--muted);
    font-size: 15px; display: none;
  }
  #nogl { top: 45%; bottom: auto; padding: 0 24px; }
  aside {
    width: 300px; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 8px 0;
  }
  .row { padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.needs_you { background: color-mix(in srgb, var(--needs) 12%, transparent); }
  .empty { color: var(--muted); padding: 18px; }
  .zzz { position: absolute; left: 0; top: 0; pointer-events: none; font: 800 16px -apple-system, sans-serif; color: #fff;
         text-shadow: 0 1px 3px rgba(40,20,60,0.5); }
  .zzz span { position: absolute; animation: zfloat 3s ease-out infinite; opacity: 0; }
  .zzz span:nth-child(2) { animation-delay: 1s; font-size: 20px; }
  .zzz span:nth-child(3) { animation-delay: 2s; font-size: 26px; }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -46px); } }
  @media (prefers-reduced-motion: reduce) { .bubble, .zzz span { animation: none !important; } .zzz span { opacity: 1; } }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #stage { min-height: 55vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
  { "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/" } }
</script>
</head>
<body>
<header>
  <h1>Agent Office</h1>
  <div class="counts">
    <span><span class="dot needs_you"></span><b id="c-needs">0</b> need you</span>
    <span><span class="dot working"></span><b id="c-working">0</b> working</span>
    <span><span class="dot your_turn"></span><b id="c-turn">0</b> your turn</span>
  </div>
  <div class="right">
    <span id="offline">Office server stopped. Run <code>agent-office</code></span>
    <div class="themes foes" role="group" aria-label="Foe" hidden>
      <button type="button" data-foe="dragon" aria-pressed="false">Dragon</button><button type="button" data-foe="golem" aria-pressed="false">Golem</button><button type="button" data-foe="random" aria-pressed="false">Random</button>
    </div>
    <div class="themes" role="group" aria-label="Theme">
      <button type="button" data-theme="office" aria-pressed="false">Office</button><button type="button" data-theme="fantasy" aria-pressed="false">Fantasy</button>
    </div>
  </div>
</header>
<main>
  <div id="stage">
    <div id="labels"></div>
    <div id="quiet">No live sessions. The office is quiet.</div>
    <div id="nogl">The 3D office needs WebGL, which is turned off in this browser. The session list still updates.</div>
  </div>
  <aside id="list"></aside>
</main>
<script type="module" src="/js/app.js"></script>
</body>
</html>
