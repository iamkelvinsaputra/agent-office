<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #d9dee7;
    --needs: #e08a00; --working: #2f7de1; --turn: #2a9d68;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b1f29; --text: #e7eaf0; --muted: #8b93a7; --line: #2a3040;
      --needs: #ffb020; --working: #5aa2ff; --turn: #4cc98f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .counts b { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .needs_you .dot, .dot.needs_you { background: var(--needs); }
  .working .dot, .dot.working { background: var(--working); }
  .your_turn .dot, .dot.your_turn { background: var(--turn); }
  #offline { margin-left: auto; color: var(--needs); font-size: 13px; display: none; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  aside {
    width: 300px; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 8px 0;
  }
  .row { padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.needs_you { background: color-mix(in srgb, var(--needs) 12%, transparent); }
  .empty { color: var(--muted); padding: 18px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #stage { min-height: 55vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Agent Office</h1>
  <div class="counts">
    <span><span class="dot needs_you"></span><b id="c-needs">0</b> need you</span>
    <span><span class="dot working"></span><b id="c-working">0</b> working</span>
    <span><span class="dot your_turn"></span><b id="c-turn">0</b> your turn</span>
  </div>
  <span id="offline">Office server stopped. Run <code>agent-office</code></span>
</header>
<main>
  <div id="stage"><canvas id="c"></canvas></div>
  <aside id="list"></aside>
</main>
<script>
"use strict";
const STATE_LABEL = { needs_you: "needs you", working: "working", your_turn: "your turn" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ---------- isometric projection ----------
const HX = 32, HY = 16, ZU = 30;           // half tile width/height, pixels per z unit
const WALL_H = 2.6;
function iso(x, y, z = 0) { return [(x - y) * HX, (x + y) * HY - z * ZU]; }

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, f) {
  const [r, g, b] = hexToRgb(hex);
  const c = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
function poly(pts, fill, stroke) {
  ctx.beginPath();
  pts.forEach(([x, y, z], i) => { const [sx, sy] = iso(x, y, z); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.6; ctx.stroke(); }
}
// Box with its far corner at (x,y,z). Visible faces: top, +y (left), +x (right).
function box(x, y, z, w, d, h, col, faces = {}) {
  const X = x + w, Y = y + d, Z = z + h;
  poly([[x, Y, z], [X, Y, z], [X, Y, Z], [x, Y, Z]], faces.left || shade(col, 0.82));
  poly([[X, y, z], [X, Y, z], [X, Y, Z], [X, y, Z]], faces.right || shade(col, 0.66));
  poly([[x, y, Z], [X, y, Z], [X, Y, Z], [x, Y, Z]], faces.top || col);
}

// ---------- palette ----------
const dark = matchMedia("(prefers-color-scheme: dark)");
function pal() {
  return dark.matches ? {
    floorA: "#3a3f4c", floorB: "#353a46", wallL: "#4a5163", wallR: "#545c70", trim: "#2b303c",
    desk: "#a07a52", chair: "#3b4252", rug: "#4b4370", text: "#e7eaf0", tag: "rgba(20,23,31,0.86)",
  } : {
    floorA: "#e3d8c6", floorB: "#dacdb8", wallL: "#cfd6e2", wallR: "#dde3ec", trim: "#aab4c4",
    desk: "#c19468", chair: "#4c566a", rug: "#a9b8d8", text: "#1d2330", tag: "rgba(255,255,255,0.92)",
  };
}
const STATE_COL = () => {
  const cs = getComputedStyle(document.documentElement);
  return { needs_you: cs.getPropertyValue("--needs").trim(), working: cs.getPropertyValue("--working").trim(),
           your_turn: cs.getPropertyValue("--turn").trim() };
};

// ---------- layout ----------
const SPACING = 2.8;
let layout = { cols: 2, rows: 1, W: 0, D: 0 };
function computeLayout(slotsNeeded) {
  const n = Math.max(2, slotsNeeded);
  const cols = n <= 2 ? 2 : n <= 6 ? 3 : 4;
  const rows = Math.max(1, Math.ceil(n / cols));
  layout = { cols, rows, W: 1.0 + cols * SPACING + 1.4, D: 1.6 + rows * SPACING + 0.2 };
}
function deskPos(slot) {
  const col = slot % layout.cols, row = Math.floor(slot / layout.cols);
  return { x: 1.4 + col * SPACING, y: 1.4 + row * SPACING };
}
function chairPos(slot) { const d = deskPos(slot); return { x: d.x + 0.8, y: d.y + 1.15 }; }
const DOOR = { x: 0.15, y: 0.8 }, AISLE_X = 0.7;

// ---------- characters ----------
const entities = new Map();   // id -> entity
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
const pick = (arr, h) => arr[h % arr.length];
const HOODIES = ["#e8655a", "#4f8fe8", "#45b07a", "#d9a43a", "#9b6ee0", "#e07bb0", "#3fb5c4", "#ef8a3c", "#f2efe6"];
const SKINS = ["#f6d7bf", "#f1c9a5", "#e0ac83", "#c68a5e", "#9a6440"];
const HAIRS = ["#2b2220", "#5a3a22", "#8a4a2a", "#c9a25a", "#1c1c24", "#b8643a", "#e6dccb"];
const SKIRTS = ["#f2a7b8", "#b9c7f0", "#c8b3ea", "#f5c99b", "#a8dcc6", "#3d4660"];
const PANTS = ["#3d4660", "#2f3a4a", "#55607a", "#6b5544", "#3f5a4e"];
const WOMAN_HAIR = ["ponytail", "bun", "long", "bob"], MAN_HAIR = ["short", "spiky", "curly"];
const ANIMALS = ["bunny", "cat", "fox"];

// Everything about how a character looks comes from its session id, so it never changes on reload.
function makeLook(id) {
  const h = k => hash(id + "#" + k);
  const woman = ((hash(id) >>> 12) & 1) === 1;
  return {
    woman, hoodie: pick(HOODIES, h(1)), skin: pick(SKINS, h(2)), hair: pick(HAIRS, h(3)),
    style: pick(woman ? WOMAN_HAIR : MAN_HAIR, h(4)), bottom: pick(woman ? SKIRTS : PANTS, h(5)),
    animal: h(6) % 3 === 0 ? pick(ANIMALS, h(7)) : null, seed: (h(8) % 1000) / 1000,
  };
}

function freeSlot() {
  const used = new Set([...entities.values()].map(e => e.slot));
  let i = 0; while (used.has(i)) i++; return i;
}
// Walk along a lane just behind the row of chairs so nobody walks through a seated colleague.
const laneY = slot => chairPos(slot).y + 0.7;
function enterPath(e) {
  const c = chairPos(e.slot), lane = laneY(e.slot);
  if (Math.abs(e.y - lane) < 0.05) return [{ x: c.x, y: lane }, c];
  return [{ x: AISLE_X, y: e.y }, { x: AISLE_X, y: lane }, { x: c.x, y: lane }, c];
}
function startLeaving(e) {
  const lane = laneY(e.slot);
  e.phase = "leaving"; e.walkT = 0;
  e.path = [{ x: e.x, y: lane }, { x: AISLE_X, y: lane }, { x: AISLE_X, y: DOOR.y }, { ...DOOR }];
}
function syncEntities(sessions) {
  const seen = new Set();
  for (const s of sessions) {
    seen.add(s.id);
    let e = entities.get(s.id);
    if (!e) {
      e = { id: s.id, slot: freeSlot(), phase: "entering", path: null, x: DOOR.x, y: DOOR.y, look: makeLook(s.id),
            sit: 0, walkT: 0, stride: 0, front: 1, side: 0 };
      entities.set(s.id, e);
    } else if (e.phase === "standing") {
      e.phase = "sitting";                      // changed its mind on the way out
    } else if (e.phase === "leaving") {
      e.phase = "entering"; e.walkT = 0; e.path = enterPath(e);
    }
    e.data = s;
  }
  for (const e of entities.values()) {
    if (seen.has(e.id) || e.phase === "leaving" || e.phase === "standing") continue;
    if (e.phase === "seated" || e.phase === "sitting") e.phase = "standing";
    else startLeaving(e);
  }
  const maxSlot = Math.max(-1, ...[...entities.values()].map(e => e.slot));
  const before = layout.cols + "x" + layout.rows;
  computeLayout(maxSlot + 1);
  const resized = layout.cols + "x" + layout.rows !== before;
  for (const e of entities.values()) {
    if (e.phase === "seated" || e.phase === "sitting" || e.phase === "standing") { if (resized) Object.assign(e, chairPos(e.slot)); }
    else if (e.phase === "entering" && (resized || !e.path)) e.path = enterPath(e);
    else if (e.phase === "leaving" && resized) startLeaving(e);
  }
}

const SPEED = 1.9;      // tiles per second at full stride
const SIT_SPEED = 2.2;  // sit-down / stand-up transitions per second
function approach(v, target, rate, dt) { return v + (target - v) * Math.min(1, rate * dt); }
function stepEntities(dt) {
  for (const e of [...entities.values()]) {
    if (e.phase === "seated") { e.sit = 1; e.front = approach(e.front, 0, 8, dt); continue; }
    if (e.phase === "sitting") {
      e.sit = reduceMotion ? 1 : Math.min(1, e.sit + dt * SIT_SPEED);
      e.front = approach(e.front, 0, 8, dt); e.side = approach(e.side, 0, 6, dt);
      if (e.sit >= 1) e.phase = "seated";
      continue;
    }
    if (e.phase === "standing") {
      e.sit = reduceMotion ? 0 : Math.max(0, e.sit - dt * SIT_SPEED);
      if (e.sit <= 0) startLeaving(e);
      continue;
    }
    // walking: ease in at the start of a trip and ease out on arrival
    e.walkT += dt;
    let remain = 0, px = e.x, py = e.y;
    for (const p of e.path) { remain += Math.hypot(p.x - px, p.y - py); px = p.x; py = p.y; }
    const ease = Math.min(1, 0.3 + e.walkT * 1.6) * Math.min(1, 0.3 + remain * 1.4);
    let left = SPEED * ease * dt;
    const ox = e.x, oy = e.y;
    while (left > 0 && e.path.length) {
      const t = e.path[0], dx = t.x - e.x, dy = t.y - e.y, dist = Math.hypot(dx, dy);
      if (dist <= left) { e.x = t.x; e.y = t.y; e.path.shift(); left -= dist; }
      else { e.x += dx / dist * left; e.y += dy / dist * left; left = 0; }
    }
    const mx = e.x - ox, my = e.y - oy, len = Math.hypot(mx, my);
    if (len > 1e-6) {
      e.stride += len * 9;
      const sx = (mx - my) / len, sy = (mx + my) / len;   // direction on screen
      e.front = approach(e.front, sy > 0 ? 1 : 0, 7, dt);  // walking down the screen = facing us
      e.side = approach(e.side, Math.sign(sx), 6, dt);
    }
    if (!e.path.length) {
      if (e.phase === "entering") { e.phase = "sitting"; e.sit = 0; }
      else if (e.phase === "leaving") entities.delete(e.id);
    }
  }
}

// ---------- drawing ----------
let view = { scale: 1, ox: 0, oy: 0, dpr: 1, w: 0, h: 0 };
function fit() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const { W, D } = layout;
  const minX = iso(0, D)[0], maxX = iso(W, 0)[0], minY = iso(0, 0, WALL_H)[1] - 10, maxY = iso(W, D)[1] + 30;
  const pad = 28;
  const scale = Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY), 2.2);
  view = { scale, dpr, w: r.width, h: r.height,
           ox: (r.width - (maxX - minX) * scale) / 2 - minX * scale,
           oy: (r.height - (maxY - minY) * scale) / 2 - minY * scale };
}
function toScreen(x, y, z) { const [sx, sy] = iso(x, y, z); return [sx * view.scale + view.ox, sy * view.scale + view.oy]; }

function drawRoom(P, t) {
  const { W, D } = layout;
  // floor tiles
  for (let i = 0; i < Math.ceil(W); i++) for (let j = 0; j < Math.ceil(D); j++) {
    const w = Math.min(1, W - i), d = Math.min(1, D - j);
    poly([[i, j, 0], [i + w, j, 0], [i + w, j + d, 0], [i, j + d, 0]], (i + j) % 2 ? P.floorA : P.floorB);
  }
  // rug under the desks
  poly([[1.1, 1.1, 0.01], [W - 1.3, 1.1, 0.01], [W - 1.3, D - 0.3, 0.01], [1.1, D - 0.3, 0.01]], P.rug);
  // walls
  poly([[0, 0, 0], [0, D, 0], [0, D, WALL_H], [0, 0, WALL_H]], P.wallL);
  poly([[0, 0, 0], [W, 0, 0], [W, 0, WALL_H], [0, 0, WALL_H]], P.wallR);
  poly([[0, 0, WALL_H], [0, D, WALL_H], [-0.15, D, WALL_H], [-0.15, -0.15, WALL_H], [W, -0.15, WALL_H], [W, 0, WALL_H]], P.trim);
  // skirting
  poly([[0.01, 0, 0], [0.01, D, 0], [0.01, D, 0.12], [0.01, 0, 0.12]], P.trim);
  poly([[0, 0.01, 0], [W, 0.01, 0], [W, 0.01, 0.12], [0, 0.01, 0.12]], P.trim);
  // door on the left wall
  poly([[0.02, DOOR.y - 0.45, 0], [0.02, DOOR.y + 0.45, 0], [0.02, DOOR.y + 0.45, 1.75], [0.02, DOOR.y - 0.45, 1.75]], shade(P.desk, 0.7));
  poly([[0.03, DOOR.y - 0.38, 0], [0.03, DOOR.y + 0.38, 0], [0.03, DOOR.y + 0.38, 1.68], [0.03, DOOR.y - 0.38, 1.68]], shade(P.desk, 0.85));
  // window on the back wall: the sky follows your local time
  const now = new Date(), hr = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  const wx = Math.max(2.2, W * 0.5), ww = Math.min(2.4, W - wx - 0.6);
  poly([[wx - 0.08, 0.02, 0.92], [wx + ww + 0.08, 0.02, 0.92], [wx + ww + 0.08, 0.02, 2.18], [wx - 0.08, 0.02, 2.18]], P.trim);
  wallPlane(wx, 0.03, 1.0, () => drawSky(hr, ww, 1.1, t));
  poly([[wx + ww / 2 - 0.03, 0.04, 1.0], [wx + ww / 2 + 0.03, 0.04, 1.0], [wx + ww / 2 + 0.03, 0.04, 2.1], [wx + ww / 2 - 0.03, 0.04, 2.1]], P.trim);
  box(wx - 0.12, 0.02, 0.86, ww + 0.24, 0.12, 0.06, shade(P.trim, 1.08));   // sill
  // wall clock, flat on the wall, showing your local time
  wallPlane(1.3, 0.03, 1.8, () => drawClock(now, P));
}

// Draw in the back wall's own plane: u runs along the wall (tiles), v runs up (z units).
function wallPlane(u, y, z, fn) {
  const [sx, sy] = iso(u, y, z);
  ctx.save(); ctx.transform(HX, HY, 0, -ZU, sx, sy); fn(); ctx.restore();
}
const SKY = [[0, "#0b1430", "#1d2a52"], [4.8, "#0b1430", "#1d2a52"], [6, "#5b6fb8", "#f6b1a0"], [7.5, "#5fb0ea", "#c4e6fb"],
             [16.5, "#5fb0ea", "#c4e6fb"], [18.3, "#4a4f9a", "#f59a6a"], [19.6, "#0b1430", "#1d2a52"], [24, "#0b1430", "#1d2a52"]];
function skyAt(hr) {
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= hr) i++;
  const [h0, a0, b0] = SKY[i], [h1, a1, b1] = SKY[i + 1], f = Math.min(1, Math.max(0, (hr - h0) / (h1 - h0)));
  return [mix(a0, a1, f), mix(b0, b1, f)];
}
function drawSky(hr, w, h, t) {
  const m = reduceMotion ? 0 : 1;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  const [top, bot] = skyAt(hr), g = ctx.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const night = hr < 4.8 || hr > 19.6 ? 1 : hr < 6 ? 1 - (hr - 4.8) / 1.2 : hr > 18.3 ? (hr - 18.3) / 1.3 : 0;
  if (night > 0) for (let k = 0; k < 11; k++) {
    ctx.globalAlpha = night * (0.55 + 0.45 * Math.sin(t * 1.3 * m + k * 2.1));
    circ(((k * 0.379 + 0.07) % 1) * w, h * (0.35 + ((k * 0.537) % 1) * 0.6), 0.022, "#fff6d8");
  }
  ctx.globalAlpha = 1;
  // sun or moon arcing across the window
  const body = (p, r, col, glow) => {
    const u = -0.15 + p * (w + 0.3), v = 0.05 + Math.sin(p * Math.PI) * h * 0.8;
    const gg = ctx.createRadialGradient(u, v, 0, u, v, r * 3.2);
    gg.addColorStop(0, glow); gg.addColorStop(1, "rgba(255,255,255,0)");
    circ(u, v, r * 3.2, gg); circ(u, v, r, col);
    return [u, v];
  };
  if (hr >= 5.6 && hr <= 18.8) {
    const p = (hr - 5.6) / 13.2, low = 1 - Math.sin(p * Math.PI);
    body(p, 0.13, mix("#fff3b8", "#ffb070", low * 0.8), "rgba(255,236,170,0.55)");
  }
  if (hr >= 18.6 || hr <= 5.8) {
    const [u, v] = body(((hr - 18.6 + 24) % 24) / 11.2, 0.11, "#f3f1e4", "rgba(220,225,255,0.35)");
    circ(u + 0.05, v + 0.03, 0.095, top);   // crescent
  }
  // drifting clouds by day
  if (night < 1) {
    ctx.globalAlpha = 0.85 * (1 - night);
    for (let k = 0; k < 2; k++) {
      const u = ((t * 0.012 * m + k * 0.55 + 0.2) % 1.3) * (w + 0.8) - 0.5, v = h * (0.55 + k * 0.22);
      oval(u, v, 0.2, 0.07, "#ffffff"); oval(u + 0.13, v + 0.04, 0.14, 0.07, "#ffffff"); oval(u - 0.12, v + 0.02, 0.12, 0.05, "#ffffff");
    }
    ctx.globalAlpha = 1;
  }
  // glass glint
  ctx.globalAlpha = 0.12; ctx.beginPath();
  ctx.moveTo(w * 0.08, 0); ctx.lineTo(w * 0.2, 0); ctx.lineTo(w * 0.42, h); ctx.lineTo(w * 0.3, h); ctx.closePath();
  ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();
}
function drawClock(now, P) {
  circ(0, 0, 0.4, P.trim);
  const g = ctx.createRadialGradient(-0.1, 0.12, 0.02, 0, 0, 0.36);
  g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#e9e7e0");
  circ(0, 0, 0.345, g);
  ctx.lineCap = "round"; ctx.strokeStyle = "#4a4f5c";
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, r0 = i % 3 ? 0.27 : 0.23;
    ctx.lineWidth = i % 3 ? 0.018 : 0.035;
    ctx.beginPath(); ctx.moveTo(Math.sin(a) * r0, Math.cos(a) * r0); ctx.lineTo(Math.sin(a) * 0.31, Math.cos(a) * 0.31); ctx.stroke();
  }
  const s = now.getSeconds() + now.getMilliseconds() / 1000, mi = now.getMinutes() + s / 60, h = (now.getHours() % 12) + mi / 60;
  const hand = (frac, len, w, col) => {
    const a = frac * Math.PI * 2;
    ctx.lineWidth = w; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(-Math.sin(a) * 0.04, -Math.cos(a) * 0.04); ctx.lineTo(Math.sin(a) * len, Math.cos(a) * len); ctx.stroke();
  };
  hand(h / 12, 0.17, 0.045, "#2b2f3a");
  hand(mi / 60, 0.25, 0.03, "#2b2f3a");
  hand((reduceMotion ? Math.floor(s) : s) / 60, 0.28, 0.012, "#e0503c");
  circ(0, 0, 0.025, "#2b2f3a");
}

function decor(P) {
  const { W, D } = layout, items = [];
  // plant in the back-right corner
  items.push({ key: W - 0.5 + 0.5, draw: () => {
    box(W - 0.8, 0.25, 0, 0.45, 0.45, 0.4, "#b5674a");
    box(W - 0.85, 0.2, 0.4, 0.55, 0.55, 0.35, "#3f9a5a");
    box(W - 0.75, 0.3, 0.75, 0.35, 0.35, 0.3, "#4fb46a");
  }});
  // water cooler
  items.push({ key: W - 0.55 + 1.6, draw: () => {
    box(W - 0.8, 1.35, 0, 0.4, 0.4, 0.75, "#e9edf2");
    box(W - 0.75, 1.4, 0.75, 0.3, 0.3, 0.35, "#8cc8f0", { top: "#a9dcfa" });
  }});
  // bookshelf on the left wall, near the back
  items.push({ key: 0.2 + D - 0.8, draw: () => {
    box(0.05, D - 1.3, 0, 0.35, 1.0, 1.5, shade(P.desk, 0.75));
    const books = ["#d9534f", "#4f8fe8", "#e3b341", "#45b07a", "#9b6ee0"];
    for (let s = 0; s < 3; s++) for (let b = 0; b < 5; b++)
      box(0.36, D - 1.25 + b * 0.18, 0.12 + s * 0.48, 0.05, 0.14, 0.3 + ((b + s) % 3) * 0.04, books[(b + s) % 5]);
  }});
  return items;
}

function drawDesk(slot, P, e, t) {
  const { x, y } = deskPos(slot);
  box(x, y, 0, 0.08, 0.08, 0.52, shade(P.desk, 0.7));
  box(x + 1.52, y, 0, 0.08, 0.08, 0.52, shade(P.desk, 0.7));
  box(x, y + 0.62, 0, 0.08, 0.08, 0.52, shade(P.desk, 0.7));
  box(x + 1.52, y + 0.62, 0, 0.08, 0.08, 0.52, shade(P.desk, 0.7));
  box(x, y, 0.52, 1.6, 0.7, 0.06, P.desk);
  // monitor facing the chair (+y side is the screen)
  box(x + 0.75, y + 0.18, 0.58, 0.1, 0.08, 0.14, "#2a2e38");
  const st = e && e.phase === "seated" ? e.data.state : null;
  const SC = STATE_COL();
  let screen = "#2b3242";
  if (st === "working") screen = (Math.floor(t * 6 + slot) % 3) ? "#cfe3ff" : "#b6d2fb";
  else if (st === "needs_you") screen = (Math.sin(t * 6) > 0) ? SC.needs_you : shade(SC.needs_you, 0.7);
  else if (st === "your_turn") screen = shade(SC.your_turn, 0.55);
  box(x + 0.4, y + 0.14, 0.72, 0.8, 0.08, 0.5, "#2a2e38", { left: screen });
  if (st === "working") for (let k = 0; k < 4; k++) {   // code lines on screen
    const lw = 0.2 + ((k * 0.31 + slot * 0.17 + Math.floor(t * 2) * 0.13) % 1) * 0.45;
    poly([[x + 0.48, y + 0.225, 1.12 - k * 0.09], [x + 0.48 + lw, y + 0.225, 1.12 - k * 0.09],
          [x + 0.48 + lw, y + 0.225, 1.08 - k * 0.09], [x + 0.48, y + 0.225, 1.08 - k * 0.09]], "#5a7bb5");
  }
  // keyboard + mug
  box(x + 0.5, y + 0.42, 0.58, 0.6, 0.18, 0.025, "#3a3f4c");
  box(x + 1.25, y + 0.3, 0.58, 0.14, 0.14, 0.14, "#f2efe9", { top: "#6b4a2e" });
}

// ---------- chibi figures (drawn upright in screen space, 1 unit = 1 world pixel) ----------
function mix(hex, to, a) {
  const [r, g, b] = hexToRgb(hex), [r2, g2, b2] = hexToRgb(to);
  return `rgb(${Math.round(r + (r2 - r) * a)},${Math.round(g + (g2 - g) * a)},${Math.round(b + (b2 - b) * a)})`;
}
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function oval(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function limb(pts, w, col) {
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = col; ctx.stroke();
}
function tri(pts, fill) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
// soft "figurine" shading: light from the top-left
function ballGrad(x, y, r, col) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, mix(col, "#ffffff", 0.38)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, 0.72));
  return g;
}
function sideGrad(w, col) {
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, mix(col, "#ffffff", 0.22)); g.addColorStop(0.45, col); g.addColorStop(1, shade(col, 0.74));
  return g;
}
const bump = (t, period, dur) => { const p = ((t % period) + period) % period; return p < dur ? Math.sin(p / dur * Math.PI) : 0; };
const R = 10.5;                                   // head radius
const ANIMAL_COL = { bunny: "#f4efe9", fox: "#e9893c" };

function drawPerson(e, P, t) {
  const L = e.look, m = reduceMotion ? 0 : 1, tt = t + L.seed * 10;
  const walking = e.phase === "entering" || e.phase === "leaving";
  const st = e.phase === "seated" ? e.data.state : null;
  const sit = e.sit, front = e.front > 0.5;
  const wTop = L.woman ? 12 : 14, wBot = L.woman ? 14.5 : 16;
  const legLen = 8 * (1 - sit), hipPx = 8 + 3.4 * sit;
  const breathe = 1 + 0.02 * Math.sin(tt * 2.1) * m;
  const SH = -13 * breathe;
  const hop = walking ? Math.abs(Math.sin(e.stride)) * 1.6 * m : 0;
  let headTilt = 0.13 * bump(tt, 8.5, 1.5) * m, nod = 0;
  if (st === "working") nod = Math.sin(tt * 5) * 0.5 * m;
  if (st === "needs_you") headTilt = 0.12;
  const cy = SH - 9 + nod;                       // head centre
  const shoulder = s => [s * (wTop / 2 - 1.5), SH + 2.5];

  // soft contact shadow on the floor
  const [gx, gy] = iso(e.x, e.y, 0);
  ctx.save(); ctx.translate(gx, gy); ctx.scale(1, 0.5);
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 13);
  sg.addColorStop(0, "rgba(0,0,0,0.3)"); sg.addColorStop(1, "rgba(0,0,0,0)");
  circ(0, 0, 13, sg); ctx.restore();

  const [ax, ay] = iso(e.x, e.y - 0.12 * sit, hipPx / ZU);
  e.anchor = [ax, ay]; e.tt = tt;
  e.head = [e.x, e.y - 0.12 * sit, (hipPx - cy + R + (L.animal === "bunny" ? 9 : L.animal ? 4 : 2)) / ZU];
  ctx.save();
  ctx.translate(ax, ay - hop);
  ctx.rotate(walking ? e.side * 0.05 : 0);
  ctx.scale(0.84 + 0.16 * Math.abs(e.front * 2 - 1), 1);   // squash a little while turning around

  const sleeve = shade(L.hoodie, 0.92), skin = L.skin;
  const arm = (s, pts) => { limb([shoulder(s), ...pts], 3.8, sleeve); const [hx, hy] = pts[pts.length - 1]; circ(hx, hy, 1.9, skin); };
  const swing = s => walking ? Math.sin(e.stride + (s > 0 ? Math.PI : 0)) * 1.6 * m : 0;
  const armsDown = () => { for (const s of [-1, 1]) arm(s, [[s * (wBot / 2 + 0.8), SH * 0.45 + swing(s) * 0.5], [s * (wBot / 2 + 0.6), -2 + swing(s)]]); };

  const legs = () => {
    if (legLen < 0.6) return;
    for (const s of [-1, 1]) {
      const lift = walking ? Math.max(0, Math.sin(e.stride + (s > 0 ? 0 : Math.PI))) * 2.2 * m : 0;
      const fy = legLen - lift;
      limb([[s * 3, -1], [s * 3, fy - 1]], L.woman ? 3.2 : 4.2, L.woman ? skin : L.bottom);
      oval(s * 3.1, fy - 0.2, 2.6, 1.6, L.woman ? "#f7f3ee" : "#3a3f4c");
    }
    if (L.woman) {   // skirt
      ctx.beginPath(); ctx.moveTo(-6.5, -1.5); ctx.lineTo(6.5, -1.5); ctx.lineTo(8.8, 4.2);
      ctx.quadraticCurveTo(0, 5.8, -8.8, 4.2); ctx.closePath(); ctx.fillStyle = sideGrad(17, L.bottom); ctx.fill();
    } else { ctx.fillStyle = L.bottom; ctx.fillRect(-6.8, -1.5, 13.6, 3); }
  };

  const body = () => {
    ctx.beginPath();
    ctx.moveTo(-wBot / 2, 0); ctx.lineTo(wBot / 2, 0);
    ctx.quadraticCurveTo(wBot / 2 + 0.6, SH * 0.5, wTop / 2, SH + 3);
    ctx.quadraticCurveTo(wTop / 2, SH, wTop / 2 - 3.5, SH);
    ctx.lineTo(-wTop / 2 + 3.5, SH);
    ctx.quadraticCurveTo(-wTop / 2, SH, -wTop / 2, SH + 3);
    ctx.quadraticCurveTo(-wBot / 2 - 0.6, SH * 0.5, -wBot / 2, 0);
    ctx.closePath(); ctx.fillStyle = sideGrad(wBot, L.hoodie); ctx.fill();
    ctx.fillStyle = shade(L.hoodie, 0.85); ctx.fillRect(-wBot / 2 + 0.3, -1.6, wBot - 0.6, 1.8);   // hem
    if (front) {
      oval(0, SH + 0.8, 6.5, 2.6, shade(L.hoodie, 0.78));                                       // hood behind the neck
      limb([[-1.8, SH + 2], [-2.1, SH + 6.5]], 0.8, "#f5f2ea"); limb([[1.8, SH + 2], [2.1, SH + 6.5]], 0.8, "#f5f2ea");
      ctx.fillStyle = shade(L.hoodie, 0.88); roundRect(-5, -6.5, 10, 4.2, 1.6); ctx.fill();    // pocket
    } else {
      oval(0, SH + 3, 6.8, 4, shade(L.hoodie, 0.8));                                            // hood on the back
      oval(0, SH + 2.4, 4.6, 2.4, shade(L.hoodie, 0.68));
    }
  };

  const ears = () => {   // animal ears, on top of the head
    if (!L.animal) return;
    const col = ANIMAL_COL[L.animal] || L.hair, inner = "#f6b7c3";
    for (const s of [-1, 1]) {
      if (L.animal === "bunny") {
        const wob = Math.sin(tt * 3 + s) * 0.06 * m;
        oval(s * 3.8, cy - R - 5.5, 2.6, 7, col, s * 0.18 + wob);
        if (front) oval(s * 3.8, cy - R - 5, 1.2, 5, inner, s * 0.18 + wob);
      } else {
        const big = L.animal === "fox" ? 1.35 : 1;
        tri([[s * R * 0.9, cy - R * 0.4], [s * R * 0.22, cy - R * 0.92], [s * R * 0.72, cy - R - 5 * big]], col);
        if (front) tri([[s * R * 0.74, cy - R * 0.55], [s * R * 0.38, cy - R * 0.85], [s * R * 0.68, cy - R - 3 * big]], inner);
        if (L.animal === "fox") tri([[s * R * 0.62, cy - R - 2.2], [s * R * 0.8, cy - R - 2.6], [s * R * 0.72, cy - R - 6.75]], "#3a2a22");
      }
    }
  };

  // long hair hanging down; behind the body when facing us, over the back when not
  const longHair = () => {
    if (L.style !== "long") return;
    const g = ballGrad(0, cy + 6, R + 8, L.hair), bot = cy + R + 11;
    ctx.beginPath(); ctx.moveTo(-R - 1.2, cy); ctx.lineTo(-R - 1.6, bot - 2);
    for (let k = 0; k < 4; k++) { const x0 = -R - 1.6 + k * (2 * R + 3.2) / 4; ctx.quadraticCurveTo(x0 + (2 * R + 3.2) / 8, bot + 2.4, x0 + (2 * R + 3.2) / 4, bot - 2); }
    ctx.lineTo(R + 1.2, cy); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  };
  const ponytail = () => {
    if (L.style !== "ponytail") return;
    const sway = Math.sin(tt * 2.2) * 1.2 * m + (walking ? Math.sin(e.stride) * 1.2 * m : 0);
    const px = front ? R * 0.7 : 0, py = front ? cy - 2 : cy + R * 0.15;
    oval(px + sway * 0.6, py + 7, 3.3, 7.2, ballGrad(px, py + 7, 7.2, L.hair), -sway * 0.06);
    if (!front) circ(0, py, 1.7, L.hoodie);
  };

  const headBack = () => {
    const g = ballGrad(0, cy, R + 1.5, L.hair);
    oval(-R + 0.3, cy + 1.5, 2, 2.6, skin); oval(R - 0.3, cy + 1.5, 2, 2.6, skin);
    circ(0, cy, R, ballGrad(0, cy, R, skin));
    ctx.save();
    if (L.style === "bob" || L.style === "long") {
      circ(0, cy, R + 0.8, g);
      if (L.style === "bob") { ctx.fillStyle = g; roundRect(-R - 1.4, cy - 1, 2 * R + 2.8, R + 1.4, 2.5); ctx.fill(); }
    } else {
      ctx.beginPath(); ctx.rect(-R - 6, cy - R - 8, 2 * R + 12, R * 1.5 + 8); ctx.clip();
      circ(0, cy, R + 0.7, g);
      ctx.restore(); ctx.save();
      if (L.style === "spiky") for (let i = -2; i <= 2; i++) {
        const a = -Math.PI / 2 + i * 0.42;
        tri([[Math.cos(a - 0.2) * R, cy + Math.sin(a - 0.2) * R], [Math.cos(a + 0.2) * R, cy + Math.sin(a + 0.2) * R],
             [Math.cos(a) * (R + 4), cy + Math.sin(a) * (R + 4)]], g);
      }
      if (L.style === "curly") for (let a = -Math.PI * 1.08; a <= 0.1; a += Math.PI / 7) circ(Math.cos(a) * (R - 0.6), cy + Math.sin(a) * (R - 0.6), 3.4, g);
    }
    ctx.restore();
    ponytail();
    if (L.style === "bun") circ(0, cy - R * 0.5, 4.8, ballGrad(0, cy - R * 0.5, 4.8, L.hair));
    if (st === "needs_you") {   // turning to look over the shoulder: a peek of cheek and eye
      oval(R * 0.78, cy + R * 0.32, 2.8, 3.8, skin);
      oval(R * 0.9, cy + R * 0.2, 0.7, 1.3, "#2b2230");
      oval(R * 0.62, cy + R * 0.55, 1.2, 0.7, "rgba(255,120,140,0.45)");
    }
  };

  const headFront = () => {
    const g = ballGrad(0, cy, R + 1.5, L.hair), fx = e.side * 1.3;
    if (L.style === "bob") { ctx.fillStyle = g; roundRect(-R - 1.4, cy - 1, 2 * R + 2.8, R + 1.4, 2.5); ctx.fill(); }
    if (!L.woman) { oval(-R + 0.3, cy + 2, 2, 2.6, skin); oval(R - 0.3, cy + 2, 2, 2.6, skin); }
    circ(0, cy, R + 0.7, g);                                   // back of the hair
    oval(0, cy + 1.6, R * 0.95, R * 0.86, ballGrad(0, cy + 1.6, R, skin));   // face
    // fringe: hair above a scalloped line
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-R - 2, cy - R - 6); ctx.lineTo(R + 2, cy - R - 6); ctx.lineTo(R + 2, cy - 1);
    const n = L.style === "spiky" ? 5 : 4, seg = (2 * R + 4) / n;
    for (let k = 0; k < n; k++) { const x0 = R + 2 - k * seg; ctx.quadraticCurveTo(x0 - seg / 2, cy + 3.2, x0 - seg, cy - 1); }
    ctx.closePath(); ctx.clip();
    circ(0, cy, R + 0.7, g);
    ctx.restore();
    if (L.woman) { oval(-R + 0.4, cy + 3, 2.2, 5.5, g); oval(R - 0.4, cy + 3, 2.2, 5.5, g); }   // side locks
    if (L.style === "bun") circ(0, cy - R - 1, 4.6, ballGrad(0, cy - R - 1, 4.6, L.hair));
    if (L.style === "curly") for (let a = -Math.PI * 0.95; a <= -0.05; a += Math.PI / 6) circ(Math.cos(a) * (R - 0.4), cy + Math.sin(a) * (R - 0.4), 3, g);
    if (L.style === "spiky") for (let i = -2; i <= 2; i++) {
      const a = -Math.PI / 2 + i * 0.42;
      tri([[Math.cos(a - 0.2) * R, cy + Math.sin(a - 0.2) * R], [Math.cos(a + 0.2) * R, cy + Math.sin(a + 0.2) * R], [Math.cos(a) * (R + 4), cy + Math.sin(a) * (R + 4)]], g);
    }
    // face
    const blink = m && (tt % 3.7) < 0.13, ey = cy + R * 0.3;
    for (const s of [-1, 1]) {
      oval(fx + s * R * 0.38, ey, 1.4, blink ? 0.35 : 2, "#2b2230");
      if (!blink) circ(fx + s * R * 0.38 + 0.5, ey - 0.8, 0.55, "#ffffff");
      oval(fx + s * R * 0.62, cy + R * 0.58, 1.9, 1.1, "rgba(255,120,140,0.45)");
    }
    ctx.beginPath(); ctx.arc(fx, cy + R * 0.6, 1.1, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.lineWidth = 0.7; ctx.strokeStyle = "#7a4a44"; ctx.stroke();
  };

  const head = () => {
    ctx.save(); ctx.translate(0, SH + 1); ctx.rotate(headTilt); ctx.translate(0, -(SH + 1));
    front ? headFront() : headBack();
    ears();
    ctx.restore();
  };

  // ---- assemble ----
  if (front) {
    if (sit < 0.5) drawTail(e, 4.5, -3, true);
    if (L.style === "long") longHair();
    if (L.style === "ponytail") ponytail();
    legs(); body(); armsDown(); head();
  } else {
    legs();
    if (st === "working") {
      for (const s of [-1, 1]) {   // elbows out, hands forward on the keyboard (hidden), alternating
        const k = Math.sin(tt * 13 + (s > 0 ? Math.PI : 0)) * 0.9 * m;
        limb([shoulder(s), [s * (wTop / 2 + 2.8), SH + 8 + k], [s * 2, SH + 6 + k]], 3.8, sleeve);
      }
    }
    body();
    if (st === "needs_you") {
      arm(-1, [[-(wBot / 2 + 0.8), SH * 0.45], [-(wBot / 2 + 0.6), -2]]);
    } else if (st !== "working") armsDown();   // idle: arms simply resting
    longHair();
    head();
    if (st === "needs_you") {     // waving
      const a = -Math.PI / 2 + 0.5 * Math.sin(tt * 9) * m, [ex, ey] = [wTop / 2 + 5, SH - 3];
      arm(1, [[ex, ey], [ex + Math.cos(a) * 7, ey + Math.sin(a) * 7]]);
    }
    if (sit < 0.5) drawTail(e, 0, -3, false);
  }
  ctx.restore();
}

// Tails: drawn with the figure while walking, or hanging off the side of the chair when seated.
function drawTail(e, ox, oy, behind) {
  const L = e.look, m = reduceMotion ? 0 : 1, sway = Math.sin(e.tt * 2.6) * m;
  if (!L.animal) return;
  if (L.animal === "cat") {
    ctx.beginPath(); ctx.moveTo(ox, oy);
    ctx.bezierCurveTo(ox - 6, oy + 3, ox - 11, oy - 2 + sway, ox - 8 + sway * 1.5, oy - 10);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.strokeStyle = L.hair; ctx.stroke();
  } else if (L.animal === "fox") {
    ctx.save(); ctx.translate(ox, oy); ctx.rotate((behind ? 0.8 : -0.8) + sway * 0.12);
    oval(0, -6.5, 3.8, 7.5, ballGrad(0, -6.5, 7.5, ANIMAL_COL.fox));
    oval(0, -12.6, 2.6, 2.6, "#fff7ee");
    ctx.restore();
  } else {
    circ(ox, oy, 3.3, ballGrad(ox, oy, 3.3, ANIMAL_COL.bunny));
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fmtAge(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  return Math.floor(sec / 3600) + "h " + Math.floor(sec % 3600 / 60) + "m";
}
function drawLabels(P, t, nowSec) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const SC = STATE_COL(), fs = Math.max(10, Math.min(13, 12 * view.scale));
  for (const e of entities.values()) {
    if (!e.head) continue;
    const [sx, sy0] = toScreen(...e.head);
    const sy = sy0 - 10 * view.scale;
    const s = e.data, st = e.phase === "seated" ? s.state : null;
    // status bubble
    if (st) {
      const bounce = st === "needs_you" && !reduceMotion ? Math.abs(Math.sin(t * 5)) * 6 : 0;
      const glyph = { needs_you: "!", working: "…", your_turn: "✓" }[st];
      const r = 11, by = sy - 44 - bounce;
      ctx.beginPath(); ctx.arc(sx, by, r, 0, Math.PI * 2); ctx.fillStyle = SC[st]; ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx - 4, by + r - 2); ctx.lineTo(sx, by + r + 6); ctx.lineTo(sx + 4, by + r - 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = `700 13px -apple-system, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(glyph, sx, by + 1);
    }
    // name tag
    let name = s.name.length > 28 ? s.name.slice(0, 27) + "…" : s.name;
    ctx.font = `600 ${fs}px -apple-system, sans-serif`;
    const tw = ctx.measureText(name).width, w = tw + 22, h = fs + 10;
    roundRect(sx - w / 2, sy - 22, w, h, h / 2); ctx.fillStyle = P.tag; ctx.fill();
    ctx.beginPath(); ctx.arc(sx - w / 2 + 10, sy - 22 + h / 2, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = st ? SC[st] : "#999"; ctx.fill();
    ctx.fillStyle = P.text; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(name, sx - w / 2 + 17, sy - 22 + h / 2 + 0.5);
  }
  if (!entities.size) {
    ctx.fillStyle = getComputedStyle(document.body).color; ctx.globalAlpha = 0.6;
    ctx.font = "500 15px -apple-system, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("No live sessions. The office is quiet.", view.w / 2, view.h - 24);
    ctx.globalAlpha = 1;
  }
}

let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.1, (nowMs - last) / 1000); last = nowMs;
  const t = nowMs / 1000;
  try { render(dt, t); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function render(dt, t) {
  stepEntities(dt);
  fit();
  const P = pal();
  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, view.dpr * view.ox, view.dpr * view.oy);
  ctx.clearRect(-1e4, -1e4, 2e4, 2e4);
  drawRoom(P, t);
  // depth-sorted scene objects
  const items = decor(P);
  const slots = Math.max(2, layout.cols * layout.rows);
  const bySlot = new Map([...entities.values()].map(e => [e.slot, e]));
  for (let s = 0; s < slots; s++) {
    const d = deskPos(s), c = chairPos(s), e = bySlot.get(s);
    items.push({ key: d.x + 0.8 + d.y + 0.35, draw: () => drawDesk(s, P, e, t) });
    items.push({ key: c.x + c.y - 0.05, draw: () => {           // chair seat
      box(c.x - 0.06, c.y - 0.06, 0, 0.12, 0.12, 0.3, "#20242c");
      box(c.x - 0.28, c.y - 0.22, 0.3, 0.56, 0.5, 0.08, P.chair);
    }});
    items.push({ key: c.x + c.y + 0.3, draw: () => {            // chair back, low enough to see the hood
      box(c.x - 0.28, c.y + 0.24, 0.38, 0.56, 0.07, 0.26, shade(P.chair, 1.1));
      if (e && e.sit >= 0.5 && e.anchor && e.x === c.x && e.y === c.y) {
        ctx.save(); ctx.translate(...e.anchor); drawTail(e, -8.5, 1, false); ctx.restore();
      }
    }});
  }
  for (const e of entities.values()) items.push({ key: e.x + e.y, draw: () => drawPerson(e, P, t) });
  items.sort((a, b) => a.key - b.key).forEach(i => i.draw());
  drawLabels(P, t, Date.now() / 1000);
}

// ---------- data ----------
const listEl = document.getElementById("list");
let lastData = { now: 0, sessions: [] }, fetchedAt = 0;
function prettyTool(d) {
  const m = /^mcp__(.+?)__(.+)$/.exec(d || "");
  return m ? m[1].replace(/^plugin_[^_]+_/, "") + ": " + m[2].replace(/_/g, " ") : (d || "");
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function renderList() {
  const nowSec = lastData.now + (Date.now() - fetchedAt) / 1000;
  const ss = lastData.sessions;
  const n = st => ss.filter(s => s.state === st).length;
  document.getElementById("c-needs").textContent = n("needs_you");
  document.getElementById("c-working").textContent = n("working");
  document.getElementById("c-turn").textContent = n("your_turn");
  document.title = n("needs_you") ? `⚠ ${n("needs_you")} · Agent Office` : "Agent Office";
  listEl.innerHTML = ss.length ? ss.map(s => `
    <div class="row ${s.state}">
      <div class="name"><span class="dot"></span>${esc(s.name)}</div>
      <div class="meta">${STATE_LABEL[s.state]} · ${esc(prettyTool(s.detail))} · ${fmtAge(nowSec - s.since)}</div>
      <div class="meta">${esc(s.cwd)}</div>
    </div>`).join("") : `<div class="empty">No live sessions.</div>`;
}
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    lastData = await r.json(); fetchedAt = Date.now();
    document.getElementById("offline").style.display = "none";
    syncEntities(lastData.sessions);
  } catch {
    document.getElementById("offline").style.display = "inline";
  }
  renderList();
}
computeLayout(2);
poll(); setInterval(poll, 1000);
requestAnimationFrame(frame);
</script>
