<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #d9dee7;
    --needs: #e08a00; --working: #2f7de1; --turn: #2a9d68; --tag: rgba(255,255,255,0.94);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b1f29; --text: #e7eaf0; --muted: #8b93a7; --line: #2a3040;
      --needs: #ffb020; --working: #5aa2ff; --turn: #4cc98f; --tag: rgba(20,23,31,0.88);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .counts b { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: #999; }
  .needs_you .dot, .dot.needs_you { background: var(--needs); }
  .working .dot, .dot.working { background: var(--working); }
  .your_turn .dot, .dot.your_turn { background: var(--turn); }
  #offline { margin-left: auto; color: var(--needs); font-size: 13px; display: none; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl {
    position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    will-change: transform;
  }
  .bubble {
    --c: #999; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff;
    font: 700 13px/22px -apple-system, sans-serif; text-align: center; position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -4px;
    border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--c);
  }
  .bubble.needs_you { --c: var(--needs); animation: hop 0.55s ease-in-out infinite alternate; }
  .bubble.working { --c: var(--working); }
  .bubble.your_turn { --c: var(--turn); }
  @keyframes hop { to { transform: translateY(-6px); } }
  .tag {
    background: var(--tag); color: var(--text); font: 600 12px -apple-system, sans-serif; white-space: nowrap;
    padding: 4px 10px 4px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,0.16);
  }
  .tag .dot { width: 7px; height: 7px; margin-right: 5px; vertical-align: 0; }
  #quiet, #nogl {
    position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: var(--muted);
    font-size: 15px; display: none;
  }
  #nogl { top: 45%; bottom: auto; padding: 0 24px; }
  aside {
    width: 300px; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 8px 0;
  }
  .row { padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.needs_you { background: color-mix(in srgb, var(--needs) 12%, transparent); }
  .empty { color: var(--muted); padding: 18px; }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none !important; } }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #stage { min-height: 55vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
  { "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/" } }
</script>
</head>
<body>
<header>
  <h1>Agent Office</h1>
  <div class="counts">
    <span><span class="dot needs_you"></span><b id="c-needs">0</b> need you</span>
    <span><span class="dot working"></span><b id="c-working">0</b> working</span>
    <span><span class="dot your_turn"></span><b id="c-turn">0</b> your turn</span>
  </div>
  <span id="offline">Office server stopped. Run <code>agent-office</code></span>
</header>
<main>
  <div id="stage">
    <div id="labels"></div>
    <div id="quiet">No live sessions. The office is quiet.</div>
    <div id="nogl">The 3D office needs WebGL, which is turned off in this browser. The session list still updates.</div>
  </div>
  <aside id="list"></aside>
</main>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/RoundedBoxGeometry.js";

const STATE_LABEL = { needs_you: "needs you", working: "working", your_turn: "your turn" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage"), labelsEl = document.getElementById("labels");

// ---------- colour helpers ----------
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, f) {
  const [r, g, b] = hexToRgb(hex), c = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
function mix(hex, to, a) {
  const [r, g, b] = hexToRgb(hex), [r2, g2, b2] = hexToRgb(to);
  return `rgb(${Math.round(r + (r2 - r) * a)},${Math.round(g + (g2 - g) * a)},${Math.round(b + (b2 - b) * a)})`;
}

// ---------- world ----------
// x runs along the back wall, y runs out from it (toward the viewer's left), z is height.
// Three.js: X = x, Z = y, Y = z * ZS (heights squashed a little to keep the old proportions).
const ZS = 0.8, Yz = z => z * ZS, WALL_H = 2.6;
const P = {   // the room always uses its light colours
  floorA: "#e3d8c6", floorB: "#dacdb8", wallL: "#cfd6e2", wallR: "#dde3ec", trim: "#aab4c4",
  desk: "#c19468", chair: "#4c566a", rug: "#a9b8d8", needs: "#f0a020",
};

// ---------- layout ----------
const SPACING = 2.8;
let layout = { cols: 2, rows: 1, W: 0, D: 0 };
function computeLayout(slotsNeeded) {
  const n = Math.max(2, slotsNeeded);
  const cols = n <= 2 ? 2 : n <= 6 ? 3 : 4;
  const rows = Math.max(1, Math.ceil(n / cols));
  layout = { cols, rows, W: 1.0 + cols * SPACING + 1.4, D: 1.6 + rows * SPACING + 0.2 };
}
function deskPos(slot) {
  const col = slot % layout.cols, row = Math.floor(slot / layout.cols);
  return { x: 1.4 + col * SPACING, y: 1.4 + row * SPACING };
}
function chairPos(slot) { const d = deskPos(slot); return { x: d.x + 0.8, y: d.y + 1.15 }; }
const DOOR = { x: 0.15, y: 0.8 }, AISLE_X = 0.8, LEAVE_X = 0.35;   // in and out aisles, well apart
// two sides of the doorway: in on the far side, out on the near side, so nobody meets head-on there
const DOOR_IN = { x: DOOR.x, y: DOOR.y + 0.18 }, DOOR_OUT = { x: DOOR.x, y: DOOR.y - 0.18 };

// ---------- characters: data ----------
const entities = new Map();   // id -> entity
let ticket = 0;               // arrival order at the door
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
const pick = (arr, h) => arr[h % arr.length];
const HOODIES = ["#e8655a", "#4f8fe8", "#45b07a", "#d9a43a", "#9b6ee0", "#e07bb0", "#3fb5c4", "#ef8a3c", "#f2efe6"];
const SKINS = ["#f6d7bf", "#f1c9a5", "#e0ac83", "#c68a5e", "#9a6440"];
const HAIRS = ["#2b2220", "#5a3a22", "#8a4a2a", "#c9a25a", "#1c1c24", "#b8643a", "#e6dccb"];
const SKIRTS = ["#f2a7b8", "#b9c7f0", "#c8b3ea", "#f5c99b", "#a8dcc6", "#3d4660"];
const PANTS = ["#3d4660", "#2f3a4a", "#55607a", "#6b5544", "#3f5a4e"];
const WOMAN_HAIR = ["ponytail", "bun", "long", "bob"], MAN_HAIR = ["short", "swept", "curly"];
const ANIMALS = ["bunny", "cat", "fox"];
const ANIMAL_COL = { bunny: "#f4efe9", fox: "#e9893c" };

// Everything about how a character looks comes from its session id, so it never changes on reload.
function makeLook(id) {
  const h = k => hash(id + "#" + k);
  const woman = ((hash(id) >>> 12) & 1) === 1;
  return {
    woman, hoodie: pick(HOODIES, h(1)), skin: pick(SKINS, h(2)), hair: pick(HAIRS, h(3)),
    style: pick(woman ? WOMAN_HAIR : MAN_HAIR, h(4)), bottom: pick(woman ? SKIRTS : PANTS, h(5)),
    animal: h(6) % 3 === 0 ? pick(ANIMALS, h(7)) : null, seed: (h(8) % 1000) / 1000,
  };
}

function freeSlot() {
  const used = new Set([...entities.values()].map(e => e.slot));
  let i = 0; while (used.has(i)) i++; return i;
}
// Walk along a lane just behind the row of chairs so nobody walks through a seated colleague.
const laneY = slot => chairPos(slot).y + 0.7;
function enterPath(e) {
  const c = chairPos(e.slot), lane = laneY(e.slot);
  if (Math.abs(e.y - lane) < 0.05) return [{ x: c.x, y: lane }, c];
  return [{ x: AISLE_X, y: e.y }, { x: AISLE_X, y: lane }, { x: c.x, y: lane }, c];
}
function startLeaving(e) {
  const lane = laneY(e.slot);
  e.phase = "leaving"; e.walkT = 0;
  // leave along a lane of their own, so nobody meets someone coming in head-on
  const out = lane + 0.35, home = [{ x: LEAVE_X, y: DOOR_OUT.y }, { ...DOOR_OUT }];
  if (e.x < 1.1) e.path = [{ x: LEAVE_X, y: e.y }, ...home];     // still in the aisles: turn straight back
  else e.path = [{ x: e.x, y: out }, { x: LEAVE_X, y: out }, ...home];
}
function syncEntities(sessions) {
  const seen = new Set();
  for (const s of sessions) {
    seen.add(s.id);
    let e = entities.get(s.id);
    if (!e) {
      e = { id: s.id, slot: freeSlot(), phase: "entering", path: null, x: DOOR_IN.x, y: DOOR_IN.y, look: makeLook(s.id),
            sit: 0, walkT: 0, stride: 0, yaw: Math.PI / 2, targetYaw: Math.PI / 2,
            outside: true, ticket: ticket++, waitT: 0, waiting: false, ghostT: 0 };
      entities.set(s.id, e);
      if (gl) addFigure(e);
    } else if (e.phase === "standing") {
      e.phase = "sitting";                      // changed its mind on the way out
    } else if (e.phase === "leaving") {
      e.phase = "entering"; e.walkT = 0; e.path = enterPath(e);
    }
    e.data = s;
  }
  for (const e of entities.values()) {
    if (seen.has(e.id) || e.phase === "leaving" || e.phase === "standing") continue;
    if (e.phase === "seated" || e.phase === "sitting") e.phase = "standing";
    else startLeaving(e);
  }
  const maxSlot = Math.max(-1, ...[...entities.values()].map(e => e.slot));
  const before = layout.cols + "x" + layout.rows;
  computeLayout(maxSlot + 1);
  const resized = layout.cols + "x" + layout.rows !== before;
  for (const e of entities.values()) {
    if (e.phase === "seated" || e.phase === "sitting" || e.phase === "standing") { if (resized) Object.assign(e, chairPos(e.slot)); }
    else if (e.phase === "entering" && (resized || !e.path)) e.path = enterPath(e);
    else if (e.phase === "leaving" && resized) startLeaving(e);
  }
  if (resized && gl) buildRoom();
}

const isWalking = e => e.phase === "entering" || e.phase === "leaving";
function heading(e) {   // unit direction toward the next waypoint
  const n = e.path && e.path[0];
  if (!n) return null;
  const dx = n.x - e.x, dy = n.y - e.y, d = Math.hypot(dx, dy);
  return d < 1e-6 ? null : [dx / d, dy / d];
}
function blockerOf(e) {   // someone just ahead of e, in its way
  const h = heading(e);
  if (!h) return null;
  for (const o of entities.values()) {
    if (o === e || o.outside || !isWalking(o)) continue;
    const rx = o.x - e.x, ry = o.y - e.y, along = rx * h[0] + ry * h[1], side = Math.abs(rx * h[1] - ry * h[0]);
    if (along > 0.02 && along < 0.6 && side < 0.24) return o;
  }
  return null;
}
// When two people are in each other's way (paths crossing), one goes first:
// whoever is leaving, then whoever arrived earlier.
const priority = e => (e.phase === "leaving" ? 1e9 : 0) - e.ticket;
function mustWait(e) {
  // Follow who-waits-for-whom. If it loops back to e, the people in the loop would wait forever,
  // so the one with the highest priority in it goes first.
  const chain = [e];
  for (let b = blockerOf(e); b; b = blockerOf(b)) {
    if (b === e) return chain.some(o => priority(o) > priority(e));
    if (chain.includes(b) || chain.length > 12) return true;   // a jam further ahead; it resolves itself
    chain.push(b);
  }
  return chain.length > 1;
}
const SPEED = 1.9;      // tiles per second at full stride
const SIT_SPEED = 2.2;  // sit-down / stand-up transitions per second
function stepEntities(dt) {
  for (const e of [...entities.values()]) {
    if (e.phase === "seated") { e.sit = 1; e.targetYaw = Math.PI; continue; }
    if (e.phase === "sitting") {
      e.sit = reduceMotion ? 1 : Math.min(1, e.sit + dt * SIT_SPEED);
      e.targetYaw = Math.PI;                    // face the desk
      if (e.sit >= 1) e.phase = "seated";
      continue;
    }
    if (e.phase === "standing") {
      e.sit = reduceMotion ? 0 : Math.max(0, e.sit - dt * SIT_SPEED);
      if (e.sit <= 0) startLeaving(e);
      continue;
    }
    // waiting outside: come in one at a time, once the doorway is clear
    if (e.outside) {
      const first = ![...entities.values()].some(o => o.outside && o.ticket < e.ticket);
      const clear = ![...entities.values()].some(o => o !== e && !o.outside && isWalking(o) && Math.hypot(o.x - DOOR_IN.x, o.y - DOOR_IN.y) < 0.6);
      if (!(first && clear)) continue;
      e.outside = false; e.walkT = 0;
    }
    // queue: wait behind anyone just ahead. If that ever lasts 4 seconds, walk on regardless
    // for a moment (brushing past) so nobody can get stuck.
    if (e.ghostT > 0) e.ghostT -= dt;
    e.waiting = e.ghostT <= 0 && mustWait(e);
    if (e.waiting) {
      e.waitT += dt; e.walkT = 0;
      if (e.waitT < 4) continue;
      e.waiting = false; e.ghostT = 1.5;
    }
    e.waitT = 0;
    // walking: ease in at the start of a trip and ease out on arrival
    e.walkT += dt;
    let remain = 0, px = e.x, py = e.y;
    for (const p of e.path || []) { remain += Math.hypot(p.x - px, p.y - py); px = p.x; py = p.y; }
    const ease = Math.min(1, 0.3 + e.walkT * 1.6) * Math.min(1, 0.3 + remain * 1.4);
    let left = SPEED * ease * dt;
    const ox = e.x, oy = e.y;
    while (left > 0 && e.path && e.path.length) {
      const t = e.path[0], dx = t.x - e.x, dy = t.y - e.y, dist = Math.hypot(dx, dy);
      if (dist <= left) { e.x = t.x; e.y = t.y; e.path.shift(); left -= dist; }
      else { e.x += dx / dist * left; e.y += dy / dist * left; left = 0; }
    }
    const mx = e.x - ox, my = e.y - oy, len = Math.hypot(mx, my);
    if (len > 1e-6) { e.stride += len * 9; e.targetYaw = Math.atan2(mx, my); }
    if (e.path && !e.path.length) {
      if (e.phase === "entering") { e.phase = "sitting"; e.sit = 0; }
      else if (e.phase === "leaving") { removeFigure(e); entities.delete(e.id); }
    }
  }
}

// ---------- 3D setup ----------
let gl = null, renderer, scene, camera, sun, roomGroup = null, screens = [], skyTex, skyCtx, clockTex, clockCtx;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
  gl = renderer.getContext();
} catch (err) { console.warn("WebGL unavailable", err); }
if (!gl) document.getElementById("nogl").style.display = "block";

if (gl) {
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  stage.prepend(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cbb6, 1.7));
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  sun = new THREE.DirectionalLight(0xfff6ea, 2.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.04;
  scene.add(sun, sun.target);

  const sky = document.createElement("canvas"); sky.width = 256; sky.height = 128;
  skyCtx = sky.getContext("2d"); skyTex = new THREE.CanvasTexture(sky); skyTex.colorSpace = THREE.SRGBColorSpace;
  const clk = document.createElement("canvas"); clk.width = clk.height = 256;
  clockCtx = clk.getContext("2d"); clockTex = new THREE.CanvasTexture(clk); clockTex.colorSpace = THREE.SRGBColorSpace;
}

// ---------- room ----------
const matCache = new Map();
function roomMat(color, rough = 0.8) {
  const k = color + "|" + rough;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: rough }));
  return matCache.get(k);
}
// Rounded box with its far corner at (x, y, z) in room units, like the old 2D box().
function rbox(x, y, z, w, d, h, color, r = 0.035, opts = {}) {
  const H = Yz(h), rr = Math.min(r, w / 2 - 0.002, d / 2 - 0.002, H / 2 - 0.002);
  const geo = rr > 0.004 ? new RoundedBoxGeometry(w, H, d, 3, rr) : new THREE.BoxGeometry(w, H, d);
  const mesh = new THREE.Mesh(geo, roomMat(color, opts.rough));
  mesh.position.set(x + w / 2, Yz(z) + H / 2, y + d / 2);
  mesh.castShadow = opts.cast !== false; mesh.receiveShadow = true;
  roomGroup.add(mesh);
  return mesh;
}
function cyl(x, y, z, rTop, rBot, h, color, seg = 24) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, Yz(h), seg), roomMat(color, 0.6));
  mesh.position.set(x, Yz(z) + Yz(h) / 2, y);
  mesh.castShadow = true; mesh.receiveShadow = true;
  roomGroup.add(mesh);
  return mesh;
}
function floorTexture(W, D) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d");
  x.fillStyle = P.floorB; x.fillRect(0, 0, 128, 128);
  x.fillStyle = P.floorA; x.fillRect(0, 0, 64, 64); x.fillRect(64, 64, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(W / 2, D / 2); t.anisotropy = 4;
  return t;
}
const owned = [];   // per-build materials and textures to free on rebuild
function own(x) { owned.push(x); return x; }

function buildRoom() {
  if (roomGroup) {
    scene.remove(roomGroup);
    roomGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    for (const x of owned.splice(0)) x.dispose();
  }
  roomGroup = new THREE.Group(); scene.add(roomGroup);
  const { W, D } = layout;

  // floor slab, chequered on top
  const side = roomMat(P.trim);
  const top = own(new THREE.MeshStandardMaterial({ map: own(floorTexture(W, D)), roughness: 0.85 }));
  const floor = new THREE.Mesh(new THREE.BoxGeometry(W + 0.15, 0.14, D + 0.15), [side, side, top, side, side, side]);
  floor.position.set((W - 0.15) / 2, -0.07, (D - 0.15) / 2); floor.receiveShadow = true; roomGroup.add(floor);
  rbox(1.1, 1.1, 0, W - 2.4, D - 1.4, 0.02, P.rug, 0.01, { cast: false });

  // walls, top trim and skirting
  rbox(-0.15, -0.15, 0, 0.15, D + 0.15, WALL_H, P.wallL, 0.02);
  rbox(0, -0.15, 0, W, 0.15, WALL_H, P.wallR, 0.02);
  rbox(-0.18, -0.18, WALL_H, 0.21, D + 0.18, 0.06, P.trim, 0.02);
  rbox(0, -0.18, WALL_H, W, 0.21, 0.06, P.trim, 0.02);
  rbox(0, 0, 0, 0.035, D, 0.12, P.trim, 0.01, { cast: false });
  rbox(0, 0, 0, W, 0.035, 0.12, P.trim, 0.01, { cast: false });

  // door on the left wall
  rbox(0, DOOR.y - 0.45, 0, 0.04, 0.9, 1.75, shade(P.desk, 0.7), 0.02);
  rbox(0.02, DOOR.y - 0.38, 0, 0.04, 0.76, 1.68, shade(P.desk, 0.85), 0.02);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), roomMat("#d8c27a", 0.35));
  knob.position.set(0.08, Yz(0.85), DOOR.y + 0.28); knob.castShadow = true; roomGroup.add(knob);

  // window on the back wall; the sky inside follows your local time
  const wx = Math.max(2.2, W * 0.5), ww = Math.min(2.4, W - wx - 0.6);

// ---------- camera: fixed dimetric view that frames the whole room ----------
let lastSize = "";
function frameCamera(force) {
  const r = stage.getBoundingClientRect(), size = r.width + "x" + r.height;
  if (!force && size === lastSize) return;
  lastSize = size;
  renderer.setSize(r.width, r.height, false);
  const { W, D } = layout, center = new THREE.Vector3(W / 2, Yz(WALL_H) / 2, D / 2);
  const el = Math.PI / 6, dir = new THREE.Vector3(Math.cos(el) * Math.SQRT1_2, Math.sin(el), Math.cos(el) * Math.SQRT1_2);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.set(0, 1, 0); camera.lookAt(center); camera.updateMatrixWorld();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const x of [-0.2, W]) for (const z of [-0.2, D]) for (const y of [-0.15, Yz(WALL_H) + 0.1]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(camera.matrixWorldInverse);
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  const pad = 28, top = 26;   // extra room on top for name tags
  const s = Math.max((x1 - x0) / (r.width - pad * 2), (y1 - y0) / (r.height - pad * 2 - top));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + top * s / 2;
  Object.assign(camera, { left: cx - r.width * s / 2, right: cx + r.width * s / 2, top: cy + r.height * s / 2, bottom: cy - r.height * s / 2 });
  camera.updateProjectionMatrix();
}

// ---------- characters: figurines ----------
const K = 1.25, LEG = 0.165, HR = 0.19;        // figure scale, standing hip height, head radius

    color, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.45, side: double ? THREE.DoubleSide : THREE.FrontSide,

const FLAT = {};
function flat(name, make) { return FLAT[name] || (FLAT[name] = make()); }

  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
const sphere = (r, w = 20, h = 14) => new THREE.SphereGeometry(r, w, h);

const UP = new THREE.Vector3(0, 1, 0);

const faceOut = (m, a, b) => m.rotation.set(-b, a, 0, "YXZ");   // point a mesh's +Z along a head normal

function makeFigure(L) {
  const root = new THREE.Group(); root.scale.setScalar(K);
  const hips = new THREE.Group(); root.add(hips);
  const hood = vinyl(L.hoodie), hoodDark = vinyl(shade(L.hoodie, 0.8)), skin = vinyl(L.skin), bottom = vinyl(L.bottom);
  const hairM = vinyl(L.hair, true), white = vinyl("#f5f2ea");

  torso.scale.set(L.woman ? 1.0 : 1.12, 1, 0.88);

  for (const s of [-1, 1]) part(new THREE.CylinderGeometry(0.006, 0.006, 0.07, 6), white, hips, s * 0.03, 0.2, 0.1);
  if (L.woman) part(new THREE.CylinderGeometry(0.105, 0.16, 0.11, 28), bottom, hips, 0, -0.025, 0);

    part(sphere(0.05), vinyl(L.woman ? "#f7f3ee" : "#3a3f4c"), g, 0, -0.135, 0.02).scale.set(0.9, 0.6, 1.3);

  const skull = new THREE.Group(); skull.position.y = 0.17; head.add(skull);
  part(sphere(HR, 36, 28), skin, skull);
  for (const s of [-1, 1]) { const p = onHead(HR * 0.96, s * Math.PI / 2, -0.25); part(sphere(0.036), skin, skull, p.x, p.y, p.z); }

  const blushM = flat("blush", () => new THREE.MeshBasicMaterial({ color: "#ff8a9a", transparent: true, opacity: 0.45, depthWrite: false }));
  const mouthM = flat("mouth", () => new THREE.MeshStandardMaterial({ color: "#7a4a44", roughness: 0.6 }));

    const a = s * 0.36, b = -0.12, p = onHead(HR * 0.985, a, b);
    const eye = part(sphere(0.026, 14, 10), eyeM, skull, p.x, p.y, p.z); faceOut(eye, a, b); eye.scale.set(0.8, 1.2, 0.45);
    const q = onHead(HR * 1.005, a + 0.05, b + 0.05); part(sphere(0.008, 8, 6), shineM, skull, q.x, q.y, q.z);
    const c = onHead(HR * 1.004, s * 0.62, -0.3);
    const blush = part(new THREE.CircleGeometry(0.032, 18), blushM, skull, c.x, c.y, c.z); faceOut(blush, s * 0.62, -0.3);

  let ponyPivot = null;

  if (L.style === "swept") {   // a little volume on top, combed to one side

  if (L.style === "long") {
    shell(HR * 1.07, 1.6, 2.4);

  if (L.style === "ponytail") {
    const p = onHead(R1, Math.PI, 0.15);
    part(sphere(0.035), vinyl(L.hoodie), skull, p.x, p.y, p.z);
    ponyPivot = new THREE.Group(); ponyPivot.position.copy(p); skull.add(ponyPivot);

        part(new THREE.CapsuleGeometry(0.02, 0.12, 4, 8), inner, g, 0, 0.1, 0.03).scale.z = 0.5;

function addFigure(e) {
  e.fig = makeFigure(e.look);
  scene.add(e.fig.root);
  const el = document.createElement("div"); el.className = "lbl";
  el.innerHTML = `<div class="bubble"></div><div class="tag"><span class="dot"></span><span class="nm"></span></div>`;
  labelsEl.appendChild(el);
  e.label = { el, bubble: el.firstChild, dot: el.querySelector(".tag .dot"), nm: el.querySelector(".nm"), key: "" };
}
function removeFigure(e) {
  if (!e.fig) return;
  scene.remove(e.fig.root);
  e.fig.root.traverse(o => o.geometry && o.geometry.dispose());
  e.label.el.remove();
}

const bump = (t, period, dur) => { const p = ((t % period) + period) % period; return p < dur ? Math.sin(p / dur * Math.PI) : 0; };
function angleTo(a, b, k) { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * k; }

function animateFigure(e, t, dt) {
  const F = e.fig, L = e.look, m = reduceMotion ? 0 : 1, tt = t + L.seed * 10;
  const k = reduceMotion ? 1 : Math.min(1, dt * 9);                 // smoothing toward each pose
  const ap = (obj, key, v) => { obj[key] += (v - obj[key]) * k; };
  const walking = isWalking(e) && !e.waiting;

  e.yaw = reduceMotion ? e.targetYaw : angleTo(e.yaw, e.targetYaw, Math.min(1, dt * 7));
  F.root.position.set(e.x, 0, e.y - 0.1 * sit);
  F.root.rotation.y = e.yaw;
  F.hips.position.y = LEG + (seatHip - LEG) * sit + (walking ? Math.abs(Math.sin(e.stride)) * 0.03 * m : 0);

  const sw = walking ? Math.sin(e.stride) * 0.6 * m : 0;
  F.legs.forEach((g, i) => { g.rotation.x = (i ? sw : -sw) * (1 - sit) - 1.5 * sit; });
  F.torso.scale.y = 1 + 0.025 * Math.sin(tt * 2.1) * m;

  // head: look at the screen while working, over the shoulder (toward you) when it needs you
  let hx = 0, hy = 0, hz = 0.12 * bump(tt, 8.5, 1.5) * m;
  if (st === "working") hx = 0.12 + Math.sin(tt * 5) * 0.035 * m;
  if (st === "needs_you") { hy = -0.95; hz = 0.08; }
  ap(F.head.rotation, "x", hx); ap(F.head.rotation, "y", hy); ap(F.head.rotation, "z", hz);
  const blink = m && (tt % 3.7) < 0.13;
  for (const eye of F.eyes) eye.scale.y = blink ? 0.15 : 1.2;

  for (const A of F.arms) {
    const s = A.s;
    let ux = 0, uz = s * 0.12, fx = -0.15, fz = 0;
    if (walking) { ux = (s > 0 ? sw : -sw) * 0.9; fx = -0.3; }
    else if (st === "working") { ux = -0.55; uz = s * 0.4; fx = -1.0 + Math.sin(tt * 13 + (s > 0 ? Math.PI : 0)) * 0.15 * m; }
    else if (st === "needs_you" && s < 0) { ux = 0; uz = s * 2.55; fx = 0; fz = s * (0.3 + 0.45 * Math.sin(tt * 9) * m); }
    else if (sit > 0.5) { ux = -0.4; uz = s * 0.1; fx = -0.9; }
    ap(A.sh.rotation, "x", ux); ap(A.sh.rotation, "z", uz); ap(A.el.rotation, "x", fx); ap(A.el.rotation, "z", fz);
  }

    F.ponyPivot.rotation.x = 0.15 + (0.08 * Math.sin(tt * 2.2) + (walking ? 0.12 * Math.sin(e.stride) : 0)) * m;
    F.ponyPivot.rotation.z = 0.08 * Math.sin(tt * 1.7) * m;
  }
  if (F.tailPivot) { F.tailPivot.rotation.y = 0.35 * Math.sin(tt * 2.6) * m; F.tailPivot.rotation.z = sit * 0.9; }
  F.earPivots.forEach((g, i) => { g.rotation.z = (L.animal === "bunny" ? 0.06 : 0.03) * Math.sin(tt * 3 + i) * m; });
}

// ---------- window sky, clock and monitor screens (painted on small canvases) ----------
const SKY = [[0, "#0b1430", "#1d2a52"], [4.8, "#0b1430", "#1d2a52"], [6, "#5b6fb8", "#f6b1a0"], [7.5, "#5fb0ea", "#c4e6fb"],
             [16.5, "#5fb0ea", "#c4e6fb"], [18.3, "#4a4f9a", "#f59a6a"], [19.6, "#0b1430", "#1d2a52"], [24, "#0b1430", "#1d2a52"]];
function skyAt(hr) {

function paintSky(c, hr, t) {

  const night = hr < 4.8 || hr > 19.6 ? 1 : hr < 6 ? 1 - (hr - 4.8) / 1.2 : hr > 18.3 ? (hr - 18.3) / 1.3 : 0;
  if (night > 0) for (let k = 0; k < 14; k++) {
    c.globalAlpha = night * (0.55 + 0.45 * Math.sin(t * 1.3 * m + k * 2.1));
    c.fillStyle = "#fff6d8"; c.beginPath();
    c.arc(((k * 0.379 + 0.07) % 1) * W, H * (1 - (0.35 + ((k * 0.537) % 1) * 0.6)), 1.4, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  const body = (p, r, col, glow) => {
    const u = (-0.06 + p * 1.12) * W, v = H - (0.05 + Math.sin(p * Math.PI) * 0.8) * H;
    const gg = c.createRadialGradient(u, v, 0, u, v, r * 3.2);
    gg.addColorStop(0, glow); gg.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = gg; c.beginPath(); c.arc(u, v, r * 3.2, 0, 7); c.fill();
    c.fillStyle = col; c.beginPath(); c.arc(u, v, r, 0, 7); c.fill();
    return [u, v];
  };
  if (hr >= 5.6 && hr <= 18.8) {
    const p = (hr - 5.6) / 13.2, low = 1 - Math.sin(p * Math.PI);
    body(p, H * 0.12, mix("#fff3b8", "#ffb070", low * 0.8), "rgba(255,236,170,0.55)");
  }
  if (hr >= 18.6 || hr <= 5.8) {
    const [u, v] = body(((hr - 18.6 + 24) % 24) / 11.2, H * 0.1, "#f3f1e4", "rgba(220,225,255,0.35)");
    c.fillStyle = top; c.beginPath(); c.arc(u + H * 0.045, v - H * 0.03, H * 0.088, 0, 7); c.fill();
  }
  if (night < 1) {
    c.globalAlpha = 0.85 * (1 - night); c.fillStyle = "#ffffff";
    for (let k = 0; k < 2; k++) {
      const u = (((t * 0.012 * m + k * 0.55 + 0.2) % 1.3) * 1.33 - 0.2) * W, v = H * (1 - (0.55 + k * 0.22));
      for (const [dx, dy, rx, ry] of [[0, 0, 0.085, 0.065], [0.055, -0.035, 0.06, 0.06], [-0.05, -0.02, 0.05, 0.045]]) {
        c.beginPath(); c.ellipse(u + dx * W, v + dy * H, rx * W, ry * H, 0, 0, 7); c.fill();
      }
    }
    c.globalAlpha = 1;
  }
  c.globalAlpha = 0.12; c.fillStyle = "#ffffff"; c.beginPath();
  c.moveTo(W * 0.08, H); c.lineTo(W * 0.2, H); c.lineTo(W * 0.42, 0); c.lineTo(W * 0.3, 0); c.closePath(); c.fill();
  c.globalAlpha = 1;
}
function paintClock(c, now) {
  const S = c.canvas.width, r = S / 2;
  c.setTransform(1, 0, 0, 1, r, r);
  const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.05, 0, 0, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#e9e7e0");
  c.fillStyle = g; c.fillRect(-r, -r, S, S);
  c.lineCap = "round"; c.strokeStyle = "#4a4f5c";
  for (let i = 0; i < 12; i++) {

    c.beginPath(); c.moveTo(Math.sin(a) * r0 * r, -Math.cos(a) * r0 * r); c.lineTo(Math.sin(a) * 0.9 * r, -Math.cos(a) * 0.9 * r); c.stroke();
  }
  const s = now.getSeconds() + (reduceMotion ? 0 : now.getMilliseconds() / 1000), mi = now.getMinutes() + s / 60, h = (now.getHours() % 12) + mi / 60;
  const hand = (frac, len, w, col) => {
    const a = frac * Math.PI * 2; c.lineWidth = w; c.strokeStyle = col;
    c.beginPath(); c.moveTo(-Math.sin(a) * 0.12 * r, Math.cos(a) * 0.12 * r); c.lineTo(Math.sin(a) * len * r, -Math.cos(a) * len * r); c.stroke();
  };
  hand(h / 12, 0.5, 13, "#2b2f3a"); hand(mi / 60, 0.74, 9, "#2b2f3a"); hand(s / 60, 0.82, 3.5, "#e0503c");
  c.fillStyle = "#2b2f3a"; c.beginPath(); c.arc(0, 0, 8, 0, 7); c.fill();

}
function paintScreen(scr, slot, st, t) {
  const tick = st === "working" ? Math.floor(t * 2) : st === "needs_you" ? (Math.sin(t * 6) > 0 ? 1 : 0) : 0;
  const key = st + ":" + tick;
  if (scr.key === key) return;
  scr.key = key;
  const c = scr.ctx, W = c.canvas.width, H = c.canvas.height;
  c.textAlign = "center"; c.textBaseline = "middle";
  if (st === "working") {
    c.fillStyle = "#e3eeff"; c.fillRect(0, 0, W, H);
    c.fillStyle = "#5a7bb5";
    for (let k = 0; k < 6; k++) {
      const lw = 0.2 + ((k * 0.31 + slot * 0.17 + tick * 0.13) % 1) * 0.55;
      c.fillRect(W * (0.08 + (k % 3 === 1 ? 0.06 : 0)), H * (0.12 + k * 0.13), W * lw * 0.8, H * 0.06);
    }
  } else if (st === "needs_you") {
    c.fillStyle = tick ? P.needs : shade(P.needs, 0.7); c.fillRect(0, 0, W, H);
    c.fillStyle = "#ffffff"; c.font = `800 ${H * 0.6}px -apple-system, sans-serif`; c.fillText("!", W / 2, H / 2 + 2);
  } else if (st === "your_turn") {
    c.fillStyle = "#2f6b52"; c.fillRect(0, 0, W, H);
    c.fillStyle = "#bff0d6"; c.font = `800 ${H * 0.5}px -apple-system, sans-serif`; c.fillText("✓", W / 2, H / 2 + 2);
  } else { c.fillStyle = "#2b3242"; c.fillRect(0, 0, W, H); }
  scr.tex.needsUpdate = true;
}

// ---------- labels ----------
const tmpV = new THREE.Vector3();
function placeLabels() {
  const r = stage.getBoundingClientRect();
  for (const e of entities.values()) {
    if (!e.label) continue;
    e.label.el.style.display = e.outside ? "none" : "";
    const F = e.fig, L = e.look;
    const extra = L.animal === "bunny" ? 0.2 : L.animal ? 0.1 : 0.02;
    tmpV.set(F.root.position.x, (F.hips.position.y + 0.28 + 0.17 + HR + extra) * K, F.root.position.z).project(camera);
    const x = (tmpV.x + 1) / 2 * r.width, y = (1 - tmpV.y) / 2 * r.height - 8;
    e.label.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    const s = e.data, st = e.phase === "seated" ? s.state : "";
    const name = s.name.length > 28 ? s.name.slice(0, 27) + "…" : s.name, key = st + "|" + name;
    if (key !== e.label.key) {
      e.label.key = key;
      e.label.bubble.className = "bubble " + st;
      e.label.bubble.style.visibility = st ? "visible" : "hidden";
      e.label.bubble.textContent = { needs_you: "!", working: "…", your_turn: "✓" }[st] || "";
      e.label.dot.className = "dot " + st;
      e.label.nm.textContent = name;
    }
  }
}

// ---------- render loop: 60 fps while you're on this tab, about 30 fps in the background, paused when hidden ----------
let lastFrame = performance.now(), lastDraw = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  if (document.hidden || nowMs - lastDraw < (document.hasFocus() ? 15 : 32)) return;
  const dt = Math.min(0.1, (nowMs - lastFrame) / 1000); lastFrame = nowMs; lastDraw = nowMs;
  const t = nowMs / 1000;
  try {
    stepEntities(dt);
    frameCamera(false);
    const now = new Date();
    paintSky(skyCtx, now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600, t); skyTex.needsUpdate = true;
    paintClock(clockCtx, now); clockTex.needsUpdate = true;
    const bySlot = new Map([...entities.values()].map(e => [e.slot, e]));
    screens.forEach((scr, slot) => { const e = bySlot.get(slot); paintScreen(scr, slot, e && e.phase === "seated" ? e.data.state : "", t); });
    for (const e of entities.values()) if (e.fig) animateFigure(e, t, dt);
    renderer.render(scene, camera);
    placeLabels();
  } catch (err) { console.error(err); }
}

// ---------- data ----------
const listEl = document.getElementById("list");
let lastData = { now: 0, sessions: [] }, fetchedAt = 0;
function fmtAge(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  return Math.floor(sec / 3600) + "h " + Math.floor(sec % 3600 / 60) + "m";
}
function prettyTool(d) {
  const m = /^mcp__(.+?)__(.+)$/.exec(d || "");
  return m ? m[1].replace(/^plugin_[^_]+_/, "") + ": " + m[2].replace(/_/g, " ") : (d || "");
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function renderList() {
  const nowSec = lastData.now + (Date.now() - fetchedAt) / 1000;
  const ss = lastData.sessions;
  const n = st => ss.filter(s => s.state === st).length;
  document.getElementById("c-needs").textContent = n("needs_you");
  document.getElementById("c-working").textContent = n("working");
  document.getElementById("c-turn").textContent = n("your_turn");
  document.title = n("needs_you") ? `⚠ ${n("needs_you")} · Agent Office` : "Agent Office";
  document.getElementById("quiet").style.display = gl && !ss.length ? "block" : "none";
  listEl.innerHTML = ss.length ? ss.map(s => `
    <div class="row ${s.state}">
      <div class="name"><span class="dot"></span>${esc(s.name)}</div>
      <div class="meta">${STATE_LABEL[s.state]} · ${esc(prettyTool(s.detail))} · ${fmtAge(nowSec - s.since)}</div>
      <div class="meta">${esc(s.cwd)}</div>
    </div>`).join("") : `<div class="empty">No live sessions.</div>`;
}
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    lastData = await r.json(); fetchedAt = Date.now();
    document.getElementById("offline").style.display = "none";
    syncEntities(lastData.sessions);
  } catch {
    document.getElementById("offline").style.display = "inline";
  }

}
computeLayout(2);
if (gl) { buildRoom(); requestAnimationFrame(frame); }
poll(); setInterval(poll, 1000);
